<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mosaic</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <meta name="theme-color" content="#2f6d54" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header__title">
      <!-- 홈(보드 목록)으로 가는 로고 -->
      <a id="brand" class="brand" href="#/" title="보드 목록">
        <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span class="brand__name">Mosaic</span>
      </a>
      <!-- 보드 안에서만 보이는 보드 제목 -->
      <div id="board-heading" class="app-header__wordmark" hidden>
        <span id="site-kicker" class="app-header__kicker">VIBE CODING · WORKSHOP</span>
        <div class="app-header__titlerow">
          <h1 id="site-title">바이브코딩 연수 게시판</h1>
          <button id="edit-title-btn" class="icon-btn" title="제목 수정" hidden>✎</button>
        </div>
      </div>
    </div>
    <div class="app-header__actions">
      <span id="teacher-badge" class="badge badge--teacher" hidden>관리자 모드</span>
      <button id="board-write-btn" class="btn btn--primary" hidden>＋ 글쓰기</button>
      <button id="add-column-btn" class="btn btn--primary" hidden>＋ 게시판 추가</button>
      <button id="copy-link-btn" class="btn btn--ghost" hidden>🔗 링크 복사</button>
      <button id="board-settings-btn" class="btn btn--ghost" hidden>⚙ 보드 설정</button>
      <button id="change-pw-btn" class="btn btn--ghost" hidden>🔑 비밀번호 변경</button>
      <button id="export-btn" class="btn btn--ghost" hidden>백업 내보내기</button>
      <button id="teacher-mode-btn" class="btn btn--ghost">관리자</button>
    </div>
  </header>

  <div id="info-banner" class="info-banner" hidden>
    <span>👋 이름만 입력하면 누구나 글을 올릴 수 있어요. 내가 쓴 글은 <b>이 브라우저 창을 닫기 전까지</b> 수정·삭제할 수 있습니다(새로고침해도 유지돼요).</span>
    <button id="info-banner-close" class="icon-btn" title="닫기">✕</button>
  </div>

  <nav id="tabbar" class="tabbar" hidden></nav>

  <main id="board" class="board">
    <div class="board__loading">불러오는 중…</div>
  </main>

  <!-- 모달 루트 -->
  <div id="modal-root"></div>

  <!-- 토스트 -->
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
